name: Build FootballIQ models

on:
  push:
    branches: [main]
    paths:
      - "results.csv"
      - "train.py"
      - "requirements.txt"
      - ".github/workflows/train-models.yml"

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train and evaluate models
        run: python train.py

      - name: Commit trained artefacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/*.joblib
          if git diff --cached --quiet; then
            echo "No model artefact changes to commit."
          else
            git commit -m "Add trained FootballIQ model artefacts [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
